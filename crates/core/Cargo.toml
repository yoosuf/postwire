[package]
name = "postwire-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared storage, MIME parsing, SMS catching, signal extraction, HTML/spam analysis, and config for Postwire — an SMTP & SMS mail catcher for development and testing"
repository = "https://github.com/yoosuf/postwire"
keywords = ["mail", "smtp", "sms", "mail-catcher", "sms-catcher", "testing", "email"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mail-parser = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
