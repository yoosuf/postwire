services:
  postwire:
    build: .
    image: postwire:latest
    ports:
      - "1025:1025" # SMTP - point your app's mailer here
      - "8025:8025" # Web UI + REST API
    environment:
      POSTWIRE_MAX_MESSAGES: 1000
    volumes:
      - postwire-data:/data
    networks:
      default: {}
    restart: unless-stopped
    # Hard memory ceiling: a bounded SQLite-backed catcher with paginated list/bulk
    # endpoints has no reason to grow unbounded; this is a backstop, not a tuning knob.
    deploy:
      resources:
        limits:
          memory: 256M

  # Optional: MCP server so AI agents (Claude Desktop, Copilot, Cursor, etc.) can
  # discover captured emails during agentic development. Runs `postwire-mcp` over
  # stdio; most MCP clients expect to spawn this themselves (see AGENTS.md), but this
  # service is handy for a quick health check: `docker compose run --rm mcp`.
  mcp:
    build: .
    image: postwire:latest
    entrypoint: ["/usr/local/bin/postwire-mcp"]
    environment:
      POSTWIRE_URL: http://postwire:8025
    depends_on:
      - postwire
    profiles: ["mcp"]
    stdin_open: true
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postwire-data:

networks:
  default: {}
