[package]
name = "postwire-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) server connecting AI agents to Postwire — enables Claude, Copilot, and Cursor to discover, wait for, and extract data from captured emails and SMS"
repository = "https://github.com/yoosuf/postwire"
keywords = ["mcp", "mail", "sms", "agents", "ai", "testing"]

[[bin]]
name = "postwire-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
